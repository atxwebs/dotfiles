# Yazi Keymap Configuration
# https://yazi-rs.github.io/docs/quick-start/#file-operations
# Default keybindings:
# - Enter: Open file / Enter directory
# - Space: Select/unselect file
# - x: Mark for deletion (then use 'd' to delete)
# - d: Delete selected files (moves to trash by default)
# - D: Permanent delete (bypasses trash)
# - y: Copy selected files
# - p: Paste files
# - /: Filter/search files
# - r: Rename
# - Esc: Cancel/exit

# Copy hovered file path to clipboard
[[mgr.prepend_keymap]]
on = "y l"
run = "shell 'echo \"$YAZI_HOVERED_PATH\" | xclip -selection clipboard'"
desc = "Copy hovered path to clipboard"

# Copy all selected file paths to clipboard  
[[mgr.prepend_keymap]]
on = "y p"
run = "shell 'echo \"$YAZI_SELECTED_PATHS\" | xclip -selection clipboard'"
desc = "Copy selected paths to clipboard"

