# Window borders and decorations
# On GNOME/X11, window decorations are controlled by the window manager
# Try setting these explicitly:
hide_window_decorations no
window_border_width 2pt
draw_minimal_borders no
window_margin_width 0

# Make borders more visible
active_border_color #00ff00
inactive_border_color #555555
bell_border_color #ff5a00

# Font settings
font_family Fira Code
font_size 11.0
font_features +liga +calt

# Cursor settings
cursor_shape block
cursor_blink_interval -1

# Scrollback
scrollback_lines 5000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 10000

# Tab bar
tab_bar_edge bottom
tab_bar_style fade
tab_title_template "{title}"

# Window padding (adds space inside terminal)
window_padding_width 2

# Mouse & Selection
copy_on_select yes
strip_trailing_spaces always

# Clipboard control (writes to both system clipboard and primary selection)
clipboard_control write-clipboard write-primary

# Performance
input_delay 0
repaint_delay 2
sync_to_monitor no

# Font & Rendering
disable_ligatures never
# text_composition_strategy removed in kitty 0.22.0+

# Window Management
# single_instance removed in newer kitty versions (use --single-instance flag if needed)
remember_window_size yes
confirm_os_window_close 0
select_by_word_characters @-./_~?&=%+#
# background_opacity 0.95  # Disabled: can cause significant performance hit

# Background color (fixes white flash - set explicit dark background)
background #000000
foreground #ffffff

# Selection colors (fixes white flash on invalid key presses)
selection_background #333333
selection_foreground #ffffff

# Bell (visual bell instead of audio)
enable_audio_bell no
visual_bell_duration 0.0
visual_bell_color #333333
bell_on_tab yes

# Notifications
notify_on_cmd_finish always

# URL detection and hyperlinks
# Detect URLs and make them clickable (underlines appear on mouse hover)
detect_urls yes
url_style curly
url_color #0087bd
# Allow hyperlinks (OSC 8 sequences)
allow_hyperlinks yes
# Show hyperlink targets on hover (optional)
# show_hyperlink_targets yes

# Keyboard shortcuts for window/tab switching
# Switch between windows (panes) in the current tab using arrow keys
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

# Switch to next/previous window (Ctrl+Tab should work now)
map ctrl+tab next_window
map ctrl+shift+tab previous_window

# Switch between tabs
map ctrl+page_up next_tab
map ctrl+page_down previous_tab

# Default kitty shortcuts (kitty_mod is Ctrl+Shift by default)
# These are the built-in shortcuts - you can use these too:
# Ctrl+Shift+] - next window
# Ctrl+Shift+[ - previous window
# Ctrl+Shift+right/left - next/previous tab

# Copy selected text to clipboard with Ctrl+C (if text selected, otherwise interrupt)
map ctrl+c copy_or_interrupt

# Toggle zoom: Switch to stack layout (single full-size window) and back
map ctrl+space toggle_layout stack

