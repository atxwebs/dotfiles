# Window borders and decorations
# On GNOME/X11, window decorations are controlled by the window manager
# Try setting these explicitly:
hide_window_decorations no
window_border_width 2pt
draw_minimal_borders no
window_margin_width 0

# Make borders more visible
active_border_color #00ff00
inactive_border_color #555555
bell_border_color #ff5a00

# Font settings
font_family Fira Code
font_size 11.0
font_features +liga +calt
# Use Consolas for italic variants (since Fira Code doesn't have italic variants)
italic_font Consolas
bold_italic_font auto

# Cursor settings
cursor_shape block
cursor_blink_interval -1

# Scrollback
scrollback_lines 5000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 10000

# Tab bar
tab_bar_edge bottom
tab_bar_style fade
tab_title_template "{title}"

# Window padding (adds space inside terminal)
window_padding_width 2

# Mouse & Selection
copy_on_select yes
strip_trailing_spaces always

# Clipboard control (writes to both system clipboard and primary selection)
clipboard_control write-clipboard write-primary

# Force TERM and color support (fixes "dumb" terminal and disabled colors)
env TERM=xterm-kitty
env FORCE_COLOR=1
env NO_COLOR=

# Paste actions: strip control codes and bracketed paste sequences for plain text pasting
paste_actions replace-dangerous-control-codes

# Performance
input_delay 0
repaint_delay 2
sync_to_monitor no

# Font & Rendering
disable_ligatures never
# text_composition_strategy removed in kitty 0.22.0+

# Window Management
# single_instance removed in newer kitty versions (use --single-instance flag if needed)
remember_window_size yes
confirm_os_window_close 0
select_by_word_characters @-./_~?&=%+#
# background_opacity 0.95  # Disabled: can cause significant performance hit

# Background color (fixes white flash - set explicit dark background)
# Commented out to preserve original CLI colors - uncomment if you want to force colors
# background #000000
# foreground #ffffff

# Selection colors (fixes white flash on invalid key presses)
selection_background #333333
selection_foreground #ffffff

# Bell (visual bell instead of audio)
enable_audio_bell no
visual_bell_duration 0.0
visual_bell_color #333333
bell_on_tab yes

# Notifications
notify_on_cmd_finish invisible 10.0

# URL detection and hyperlinks
# Detect URLs and make them clickable (underlines appear on mouse hover)
detect_urls yes
url_style curly
url_color #0087bd
# Allow hyperlinks (OSC 8 sequences)
allow_hyperlinks yes
# Show hyperlink targets on hover (optional)
# show_hyperlink_targets yes

# Word navigation (jump by words)
map ctrl+left send_text all \x1b\x62
map ctrl+right send_text all \x1b\x66

# Word deletion (delete word backwards)
map ctrl+backspace send_text all \x1b\x08

# Delete from cursor to end of line (same as Ctrl+K)
map ctrl+shift+delete send_text all \x0b

# Keyboard shortcuts for window/tab switching
# Switch between windows (panes) in the current tab using Alt+Arrow keys
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

# Switch to next/previous window (Ctrl+Tab should work now)
map ctrl+tab next_window
map ctrl+shift+tab previous_window

# Switch between tabs
map ctrl+page_up next_tab
map ctrl+page_down previous_tab

# Create new tab
map ctrl+t new_tab

# Close window (pane)
map ctrl+w close_window

# Default kitty shortcuts (kitty_mod is Ctrl+Shift by default)
# These are the built-in shortcuts - you can use these too:
# Ctrl+Shift+] - next window
# Ctrl+Shift+[ - previous window
# Ctrl+Shift+right/left - next/previous tab

# Copy selected text to clipboard with Ctrl+C (if text selected, otherwise interrupt)
map ctrl+c copy_or_interrupt

# Paste from clipboard
map ctrl+v paste_from_clipboard
map shift+insert paste_from_clipboard

# Toggle zoom: Switch to stack layout (single full-size window) and back
map ctrl+space toggle_layout stack

